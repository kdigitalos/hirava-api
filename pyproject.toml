[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hirava-api"
version = "0.2.0"
description = "FastAPI backend for Hiravah Core, RMS, and HRMS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<2.1", "alembic>=1.13,<2",
  "pydantic-settings>=2.6,<3", "pyjwt[crypto]>=2.9,<3",
  "psycopg[binary]>=3.2,<4", "python-multipart>=0.0.18,<1",
  "email-validator>=2.2,<3",
  "httpx>=0.27,<1.0",
  "boto3>=1.35,<2",
  "reportlab>=4,<5",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.data" = ["imported_schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
