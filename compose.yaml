services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hirava}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup_local.py first}
      POSTGRES_DB: ${POSTGRES_DB:-hirava}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hirava}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hirava}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hirava}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hirava}
      STORAGE_PATH: /app/storage
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - documents:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hirava}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hirava}
    command: ["python", "-m", "app.workers.outbox"]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
  documents:
